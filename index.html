<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine con amigos</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 15px; }
    .controles { max-width: 800px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    input, button { padding: 10px; font-size: 15px; border-radius: 6px; border: none; }
    input { background: #222; color: #fff; flex: 1; min-width: 140px; }
    button { background: #e50914; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #f40612; }
    #avisoAutoplay { display: none; background: #ff9800; color: #000; padding: 10px; max-width: 800px; margin: 10px auto; border-radius: 6px; font-weight: bold; cursor: pointer; }
    video { width: 100%; max-width: 800px; background: #000; border-radius: 6px; }
    #ytContenedor { width: 100%; max-width: 800px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; display: none; border-radius: 6px; overflow: hidden; }
    #ytContenedor iframe { width: 100%; height: 100%; }
    #chat { max-width: 800px; margin: 15px auto; text-align: left; }
    #mensajes { height: 180px; overflow-y: auto; background: #1c1c1c; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    #mensajes p { margin: 5px 0; word-break: break-word; }
    .chat-inputs { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <h1>Cine con amigos</h1>

  <div class="controles">
    <input id="nombreUsuario" placeholder="Tu nombre" maxlength="20" style="max-width: 140px;">
    <input id="nombreSala" placeholder="Nombre de la sala" maxlength="20" style="max-width: 140px;">
    <button onclick="unirseSala()">Unirse a sala</button>
  </div>

  <div class="controles">
    <input id="urlVideo" placeholder="Pega aquí el enlace de YouTube o .mp4">
    <button onclick="cargarVideo()">Cargar video</button>
  </div>

  <div id="avisoAutoplay" onclick="activarReproduccion()">
    ⚠️ Haz clic aquí para activar el sonido y sincronizar el video
  </div>

  <video id="video" controls playsinline></video>
  <div id="ytContenedor"><div id="ytPlayer"></div></div>

  <div id="chat">
    <div id="mensajes"></div>
    <div class="chat-inputs">
      <input id="texto" placeholder="Escribe un mensaje y presiona Enter...">
      <button onclick="enviarMensaje()">Enviar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const socket = io();
    const video = document.getElementById('video');
    const ytContenedor = document.getElementById('ytContenedor');
    const avisoAutoplay = document.getElementById('avisoAutoplay');

    let ignorarHasta = 0;
    let modo = 'mp4';
    let ytPlayer = null;
    let ytListo = false;
    let ytPendiente = null;
    let ultimoEstadoYT = -1;
    let ultimoTiempoYT = 0;

    function bloquearEventosLocales(ms = 800) {
      ignorarHasta = Date.now() + ms;
    }

    function estaIgnorando() {
      return Date.now() < ignorarHasta;
    }

    function sacarIdYouTube(url) {
      const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function unirseSala() {
      const sala = document.getElementById('nombreSala').value.trim() || 'general';
      socket.emit('unirseA_sala', sala);
    }

    function cargarVideo() {
      const url = document.getElementById('urlVideo').value.trim();
      if (!url) return;
      socket.emit('cargar', url);
    }

    function activarReproduccion() {
      avisoAutoplay.style.display = 'none';
      if (modo === 'mp4') video.play().catch(() => {});
      else if (ytListo) ytPlayer.playVideo();
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        width: '100%',
        height: '100%',
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: () => {
            ytListo = true;
            if (ytPendiente) {
              aplicarEstadoYouTube(ytPendiente);
              ytPendiente = null;
            }
          },
          onStateChange: alCambiarEstadoYT
        }
      });
      setInterval(revisarSaltoYT, 1000);
    }

    function aplicarEstadoYouTube(data) {
      bloquearEventosLocales(1500);
      ytPlayer.loadVideoById({ videoId: data.id, startSeconds: data.tiempo || 0 });
      if (data.pausado) {
        setTimeout(() => ytPlayer.pauseVideo(), 500);
      }
    }

    function alCambiarEstadoYT(e) {
      if (estaIgnorando() || modo !== 'youtube') return;
      const t = ytPlayer.getCurrentTime();
      if (e.data === YT.PlayerState.PLAYING) {
        socket.emit('play', t);
      } else if (e.data === YT.PlayerState.PAUSED) {
        socket.emit('pause', t);
      }
      ultimoEstadoYT = e.data;
      ultimoTiempoYT = t;
    }

    function revisarSaltoYT() {
      if (modo !== 'youtube' || !ytListo || estaIgnorando()) return;
      const t = ytPlayer.getCurrentTime();
      if (Math.abs(t - ultimoTiempoYT) > 2.5) {
        socket.emit('seek', t);
      }
      ultimoTiempoYT = t;
    }

    socket.on('cargar', (data) => {
      const url = data.url;
      const tiempo = data.tiempo || 0;
      const pausado = data.pausado || false;
      if (!url) {
        video.style.display = 'none';
        ytContenedor.style.display = 'none';
        return;
      }

      const id = sacarIdYouTube(url);
      bloquearEventosLocales(1500);

      if (id) {
        modo = 'youtube';
        video.pause();
        video.style.display = 'none';
        ytContenedor.style.display = 'block';
        if (ytListo) {
          aplicarEstadoYouTube({ id, tiempo, pausado });
        } else {
          ytPendiente = { id, tiempo, pausado };
        }
      } else {
        modo = 'mp4';
        if (ytListo) ytPlayer.stopVideo();
        ytContenedor.style.display = 'none';
        video.style.display = 'block';
        video.src = url;
        video.currentTime = tiempo;
        if (!pausado) {
          video.play().catch(() => { avisoAutoplay.style.display = 'block'; });
        }
      }
    });

    video.addEventListener('play', () => {
      if (!estaIgnorando() && modo === 'mp4') socket.emit('play', video.currentTime);
    });

    video.addEventListener('pause', () => {
      if (!estaIgnorando() && modo === 'mp4') socket.emit('pause', video.currentTime);
    });

    video.addEventListener('seeked', () => {
      if (!estaIgnorando() && modo === 'mp4') socket.emit('seek', video.currentTime);
    });

    socket.on('play', (t) => {
      bloquearEventosLocales(1200);
      if (modo === 'youtube' && ytListo) {
        if (Math.abs(ytPlayer.getCurrentTime() - t) > 1.5) ytPlayer.seekTo(t, true);
        ytPlayer.playVideo();
      } else {
        if (Math.abs(video.currentTime - t) > 1.5) video.currentTime = t;
        video.play().catch(() => { avisoAutoplay.style.display = 'block'; });
      }
    });

    socket.on('pause', (t) => {
      bloquearEventosLocales(1200);
      if (modo === 'youtube' && ytListo) {
        ytPlayer.seekTo(t, true);
        ytPlayer.pauseVideo();
      } else {
        video.currentTime = t;
        video.pause();
      }
    });

    socket.on('seek', (t) => {
      bloquearEventosLocales(1200);
      if (modo === 'youtube' && ytListo) {
        ytPlayer.seekTo(t, true);
      } else {
        video.currentTime = t;
      }
    });

    function enviarMensaje() {
      const input = document.getElementById('texto');
      const nombre = document.getElementById('nombreUsuario').value.trim() || 'Anónimo';
      if (!input.value.trim()) return;
      socket.emit('mensaje', { nombre, texto: input.value.trim() });
      input.value = '';
    }

    document.getElementById('texto').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarMensaje();
    });

    socket.on('mensaje', (data) => {
      const div = document.getElementById('mensajes');
      const p = document.createElement('p');
      const strong = document.createElement('strong');
      strong.textContent = data.nombre + ': ';
      p.appendChild(strong);
      p.appendChild(document.createTextNode(data.texto));
      div.appendChild(p);
      div.scrollTop = div.scrollHeight;
    });

    // Unirse a la sala por defecto al cargar la página
    window.onload = () => unirseSala();
  </script>
</body>
</html>
