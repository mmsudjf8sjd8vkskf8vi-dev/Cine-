<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine2Gether</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
    #video-container { max-width: 800px; margin: 0 auto; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    .controls { max-width: 800px; margin: 20px auto; display: flex; gap: 10px; }
    input { flex-grow: 1; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px 20px; border-radius: 4px; border: none; background: #e50914; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #b80710; }
    #chat { max-width: 800px; margin: 20px auto; text-align: left; background: #1e1e1e; padding: 10px; height: 150px; overflow-y: scroll; border-radius: 4px; }
    .msg { margin-bottom: 5px; }
    .msg.vip { color: gold; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Cine2Gether</h1>

  <div>
    <input type="text" id="userNameInput" placeholder="Tu nombre" maxlength="24">
    <button onclick="joinRoom()">Entrar a la Sala</button>
  </div>

  <div id="video-container">
    <div id="player">Esperando video...</div>
  </div>

  <div class="controls">
    <input type="text" id="mediaInput" placeholder="Enlace de YouTube, playlist o video...">
    <button onclick="sendMedia(false)">Ver</button>
    <button onclick="sendMedia(true)">Cargar lista</button>
  </div>

  <div class="controls">
    <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
    <button onclick="sendChat()">Enviar</button>
  </div>

  <div id="chat"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let player = null;

    function joinRoom() {
      const name = document.getElementById('userNameInput').value;
      socket.emit('join_room', { userName: name });
    }

    function sendMedia(clearQueue) {
      const input = document.getElementById('mediaInput').value;
      if (!input.trim()) return;
      socket.emit('add_media', { input: input, clearQueue: clearQueue });
      document.getElementById('mediaInput').value = '';
    }

    function sendChat() {
      const text = document.getElementById('chatInput').value;
      if (!text.trim()) return;
      socket.emit('chat_message', { text: text });
      document.getElementById('chatInput').value = '';
    }

    socket.on('room_state', (state) => {
      const container = document.getElementById('video-container');
      if (state.currentVideo) {
        if (state.currentVideo.type === 'youtube') {
          container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${state.currentVideo.id}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
          container.innerHTML = `<video width="100%" height="100%" controls autoplay src="${state.currentVideo.url}"></video>`;
        }
      } else {
        container.innerHTML = 'No hay video cargado.';
      }

      const chatBox = document.getElementById('chat');
      chatBox.innerHTML = state.messages.map(m => `<div class="msg ${m.isVip ? 'vip' : ''}"><b>${m.sender}:</b> ${m.text}</div>`).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('chat_message', (msg) => {
      const chatBox = document.getElementById('chat');
      chatBox.innerHTML += `<div class="msg ${msg.isVip ? 'vip' : ''}"><b>${msg.sender}:</b> ${msg.text}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    socket.on('error_msg', (err) => {
      alert(err);
    });

    socket.on('kicked', (data) => {
      alert(data.message);
      window.location.reload();
    });
  </script>
</body>
</html>
