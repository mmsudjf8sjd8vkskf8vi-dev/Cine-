<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cine2Gether</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0d12; color: #f3f4f6; min-height: 100vh; padding: 12px; }
    .app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #151922; border: 1px solid #262c3a; border-radius: 12px; padding: 12px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 1.1rem; color: #fbbf24; }
    .badge { background: #232938; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; }
    .badge.vip { background: #fbbf24; color: #111827; font-weight: 700; }
    .player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    .player-box iframe,
    .player-box video { width: 100%; height: 100%; border: 0; display: block; }
    .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #9ca3af; font-size: 0.9rem; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    input { flex: 1; background: #0e1118; color: #f3f4f6; border: 1px solid #2c3344; border-radius: 8px; padding: 9px 11px; font-size: 0.92rem; }
    button { background: #fbbf24; color: #111827; border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    button.secondary { background: #242a3a; color: #f3f4f6; }
    .status { font-size: 0.84rem; color: #93c5fd; margin-top: 8px; min-height: 18px; }
    .results { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .result-item { display: flex; gap: 10px; align-items: center; background: #10131a; border: 1px solid #222836; border-radius: 10px; padding: 8px; }
    .thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-title { font-size: 0.88rem; font-weight: 600; line-height: 1.25; margin-bottom: 6px; }
    .result-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .queue-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .queue-item { background: #10131a; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; }
    .chat-log { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .msg { font-size: 0.85rem; background: #10131a; padding: 7px 10px; border-radius: 8px; }
    .msg strong { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card topbar">
      <div class="brand">Cine2Gether</div>
      <div class="badge" id="userBadge">Conectando...</div>
      <div class="badge" id="roomBadge">Sala: general</div>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0;">
        <input id="vipInput" type="password" placeholder="Clave VIP (ej. VIP2026)..." />
        <button id="btnVip">Activar VIP</button>
      </div>
    </div>

    <div class="card">
      <div class="player-box">
        <div id="ytPlayer"></div>
        <video id="directPlayer" controls playsinline style="display:none;"></video>
        <div class="placeholder" id="placeholder">Busca un video o pega un enlace de YouTube o playlist.</div>
      </div>

      <div class="row">
        <input id="searchInput" type="text" placeholder="Buscar o pegar enlace de YouTube / playlist..." />
        <button id="btnSearch">Buscar</button>
        <button id="btnImport" class="secondary">Cargar</button>
      </div>

      <div class="row">
        <button id="btnPlayPause" class="secondary">Play / Pausa</button>
        <button id="btnNext" class="secondary">Siguiente</button>
      </div>

      <div class="status" id="statusText"></div>
      <div class="results" id="resultsBox"></div>
    </div>

    <div class="card">
      <strong>Cola (<span id="queueCount">0</span>)</strong>
      <ul class="queue-list" id="queueList"></ul>
    </div>

    <div class="card">
      <strong>Chat</strong>
      <div class="chat-log" id="chatLog"></div>
      <div class="row">
        <input id="chatInput" type="text" placeholder="Escribe un mensaje..." />
        <button id="btnSendChat">Enviar</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const ytContainer = document.getElementById('ytPlayer');
    const directPlayer = document.getElementById('directPlayer');
    const placeholder = document.getElementById('placeholder');
    const statusText = document.getElementById('statusText');
    const resultsBox = document.getElementById('resultsBox');
    const queueList = document.getElementById('queueList');
    const queueCount = document.getElementById('queueCount');
    const chatLog = document.getElementById('chatLog');
    const userBadge = document.getElementById('userBadge');
    const roomBadge = document.getElementById('roomBadge');

    let ytPlayer = null;
    let ytReady = false;
    let pendingYt = null;
    let currentVideoKey = null;
    let isRemoteSync = false;

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('ytPlayer', {
        width: '100%',
        height: '100%',
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: () => {
            ytReady = true;
            if (pendingYt) {
              loadYouTubeVideo(pendingYt.id, pendingYt.time, pendingYt.isPlaying);
              pendingYt = null;
            }
          },
          onStateChange: (e) => {
            if (isRemoteSync || !ytPlayer) return;
            const t = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
            if (e.data === YT.PlayerState.PLAYING) {
              socket.emit('player_sync', { action: 'play', time: t });
            } else if (e.data === YT.PlayerState.PAUSED) {
              socket.emit('player_sync', { action: 'pause', time: t });
            } else if (e.data === YT.PlayerState.ENDED) {
              socket.emit('next_video');
            }
          }
        }
      });
    };

    function setStatus(msg) {
      statusText.textContent = msg || '';
    }

    function loadYouTubeVideo(videoId, startTime = 0, shouldPlay = true) {
      directPlayer.pause();
      directPlayer.removeAttribute('src');
      directPlayer.load();
      directPlayer.style.display = 'none';
      placeholder.style.display = 'none';

      if (!ytReady || !ytPlayer || !ytPlayer.loadVideoById) {
        ytContainer.style.display = 'block';
        pendingYt = { id: videoId, time: startTime, isPlaying: shouldPlay };
        return;
      }

      ytContainer.style.display = 'block';
      isRemoteSync = true;
      if (shouldPlay) {
        ytPlayer.loadVideoById({ videoId, startSeconds: Math.max(0, startTime || 0) });
      } else {
        ytPlayer.cueVideoById({ videoId, startSeconds: Math.max(0, startTime || 0) });
      }
      setTimeout(() => { isRemoteSync = false; }, 600);
    }

    function loadDirectVideo(url, startTime = 0, shouldPlay = true) {
      if (ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch {}
      }
      ytContainer.style.display = 'none';
      placeholder.style.display = 'none';
      directPlayer.style.display = 'block';

      isRemoteSync = true;
      directPlayer.src = url;
      directPlayer.onloadedmetadata = () => {
        directPlayer.currentTime = Math.max(0, startTime || 0);
        if (shouldPlay) {
          directPlayer.play().catch(() => setStatus('Toca el video para iniciar.'));
        }
        setTimeout(() => { isRemoteSync = false; }, 400);
      };
      directPlayer.onerror = () => {
        setStatus('No se pudo reproducir el enlace directo.');
      };
    }

    function clearPlayer() {
      currentVideoKey = null;
      directPlayer.pause();
      directPlayer.removeAttribute('src');
      directPlayer.style.display = 'none';
      if (ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch {}
      }
      ytContainer.style.display = 'none';
      placeholder.style.display = 'flex';
    }

    function renderResults(results) {
      resultsBox.innerHTML = '';
      if (!results || !results.length) {
        resultsBox.innerHTML = '<div class="status">Sin resultados.</div>';
        return;
      }

      results.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'result-item';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = item.thumbnail || '';
        img.alt = item.title || 'Video';

        const info = document.createElement('div');
        info.className = 'result-info';

        const title = document.createElement('div');
        title.className = 'result-title';
        title.textContent = item.title || item.url;

        const actions = document.createElement('div');
        actions.className = 'result-actions';

        const btnPlay = document.createElement('button');
        btnPlay.textContent = 'Ver ahora';
        btnPlay.onclick = () => {
          socket.emit('add_media', { item, playNow: true });
          setStatus(`Reproduciendo: ${item.title}`);
        };

        const btnAdd = document.createElement('button');
        btnAdd.className = 'secondary';
        btnAdd.textContent = '+ Añadir a cola';
        btnAdd.onclick = () => {
          socket.emit('add_media', { item, playNow: false });
          setStatus(`Añadido a la cola: ${item.title}`);
        };

        actions.appendChild(btnPlay);
        actions.appendChild(btnAdd);
        info.appendChild(title);
        info.appendChild(actions);
        div.appendChild(img);
        div.appendChild(info);
        resultsBox.appendChild(div);
      });
    }

    function renderRoomState(state) {
      roomBadge.textContent = `Sala: ${state.roomId || 'general'}`;
      queueCount.textContent = (state.queue || []).length;
      queueList.innerHTML = '';

      (state.queue || []).forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.textContent = `${idx + 1}. ${item.title || item.url}`;
        queueList.appendChild(li);
      });

      const v = state.currentVideo;
      if (!v) {
        clearPlayer();
        return;
      }

      const key = `${v.type}:${v.id}:${v.url}`;
      if (key !== currentVideoKey) {
        currentVideoKey = key;
        setStatus(`Cargando: ${v.title || v.url}`);
        if (v.type === 'youtube') {
          loadYouTubeVideo(v.id, state.currentTime || 0, Boolean(state.isPlaying));
        } else {
          loadDirectVideo(v.url, state.currentTime || 0, Boolean(state.isPlaying));
        }
      }
    }

    socket.on('connect', () => {
      socket.emit('join_room', { roomId: 'general' });
    });

    socket.on('joined_success', ({ user, roomId }) => {
      userBadge.textContent = user.name;
      roomBadge.textContent = `Sala: ${roomId}`;
      setStatus('Conectado.');
    });

    socket.on('vip_status', ({ isVip, message }) => {
      if (isVip) {
        userBadge.classList.add('vip');
        userBadge.textContent = `${userBadge.textContent} ★ VIP`;
      }
      setStatus(message || '');
    });

    socket.on('search_results', ({ results }) => {
      setStatus(`Resultados: ${(results || []).length}`);
      renderResults(results);
    });

    socket.on('room_state', (state) => {
      renderRoomState(state);
    });

    socket.on('player_sync', ({ action, time, isPlaying }) => {
      isRemoteSync = true;
      if (currentVideoKey && currentVideoKey.startsWith('youtube:') && ytPlayer && ytPlayer.seekTo) {
        if (typeof time === 'number') ytPlayer.seekTo(time, true);
        if (action === 'play' || isPlaying) ytPlayer.playVideo();
        if (action === 'pause' || !isPlaying) ytPlayer.pauseVideo();
      } else if (directPlayer.style.display !== 'none') {
        if (typeof time === 'number') directPlayer.currentTime = time;
        if (action === 'play' || isPlaying) directPlayer.play().catch(() => {});
        if (action === 'pause' || !isPlaying) directPlayer.pause();
      }
      setTimeout(() => { isRemoteSync = false; }, 500);
    });

    socket.on('chat_message', (msg) => {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<strong>${msg.sender}${msg.isVip ? ' ★' : ''}:</strong> ${msg.text}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    });

    socket.on('error_msg', (msg) => {
      setStatus(msg || 'Ocurrió un error.');
    });

    document.getElementById('btnVip').addEventListener('click', () => {
      const key = document.getElementById('vipInput').value.trim();
      socket.emit('activate_vip', { key });
    });

    document.getElementById('btnSearch').addEventListener('click', () => {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) {
        setStatus('Escribe algo o pega un enlace.');
        return;
      }
      setStatus('Buscando...');
      socket.emit('search_media', { query: q });
    });

    document.getElementById('btnImport').addEventListener('click', () => {
      const val = document.getElementById('searchInput').value.trim();
      if (!val) {
        setStatus('Pega un enlace de video o playlist.');
        return;
      }
      setStatus('Cargando enlace / playlist...');
      socket.emit('add_media', { input: val, playNow: true });
    });

    document.getElementById('btnPlayPause').addEventListener('click', () => {
      if (currentVideoKey && currentVideoKey.startsWith('youtube:') && ytPlayer && ytPlayer.getPlayerState) {
        const state = ytPlayer.getPlayerState();
        const t = ytPlayer.getCurrentTime();
        if (state === YT.PlayerState.PLAYING) {
          ytPlayer.pauseVideo();
          socket.emit('player_sync', { action: 'pause', time: t });
        } else {
          ytPlayer.playVideo();
          socket.emit('player_sync', { action: 'play', time: t });
        }
      } else if (directPlayer.style.display !== 'none') {
        const t = directPlayer.currentTime;
        if (directPlayer.paused) {
          directPlayer.play().catch(() => {});
          socket.emit('player_sync', { action: 'play', time: t });
        } else {
          directPlayer.pause();
          socket.emit('player_sync', { action: 'pause', time: t });
        }
      }
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      socket.emit('next_video');
    });

    document.getElementById('btnSendChat').addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat_message', { text });
      input.value = '';
    });

    directPlayer.addEventListener('play', () => {
      if (!isRemoteSync) socket.emit('player_sync', { action: 'play', time: directPlayer.currentTime });
    });

    directPlayer.addEventListener('pause', () => {
      if (!isRemoteSync) socket.emit('player_sync', { action: 'pause', time: directPlayer.currentTime });
    });

    directPlayer.addEventListener('ended', () => {
      if (!isRemoteSync) socket.emit('next_video');
    });
  </script>
</body>
</html>
